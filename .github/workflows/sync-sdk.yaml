name: sync sdk
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'The name of the sdk release channel'
        required: true
        default: 'prod-staging'
        type: choice
        options:
          - prod-stable
          - prod-staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: staging

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Bump SDK version
        id: bump-sdk
        run: |
          echo "Bumping Go SDK to latest from ${{ inputs.channel }}..."
          go get unikraft.com/cloud/sdk@${{ inputs.channel }} || true

      - name: Check for changes in go.mod/go.sum
        id: check-changes
        shell: bash
        run: |
          if git diff --quiet HEAD; then
            echo "No changes detected. Skipping PR creation." >> $GITHUB_OUTPUT
            exit 0
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in go.mod/go.sum:"
            git diff --stat go.mod go.sum || true

      - name: Create pull request
        if: steps.check-changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          base: staging
          branch: sync/go-sdk-${{ inputs.channel }}-${{ github.sha }}[:${{ github.run_id }}]
          commit-message: 'gomod(deps): Bump go-sdk to the latest version'
          title: "gomod(deps): Bump 'go-sdk' to the latest version"
          body: |
            This PR was automatically generated by a workflow dispatch.

            It updates `unikraft.com/cloud/sdk` to its latest available version from `${{ inputs.channel }}`.
          committer: Unikraft Bot <monkey@unikraft.io>
          author: Unikraft Bot <monkey@unikraft.io>
          add-paths: |
            go.mod
            go.sum
